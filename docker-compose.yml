version: '3.4'
services:
  steinbock:
    image: ghcr.io/bodenmillergroup/steinbock:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: steinbock
      args:
        - TENSORFLOW_TARGET=tensorflow
        - STEINBOCK_TARGET=steinbock
    volumes:
      - ./data:/data:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ~/.Xauthority:/home/steinbock/.Xauthority:ro
    environment:
      - DISPLAY
  steinbock-debug:
    image: ghcr.io/bodenmillergroup/steinbock:latest
    volumes:
      - ./data:/data:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ~/.Xauthority:/home/steinbock/.Xauthority:ro
    environment:
      - DISPLAY
    entrypoint: /bin/bash
    command: ['-c', 'python -m pip install debugpy -t /tmp && python /tmp/debugpy --wait-for-client --listen 0.0.0.0:5678 -m steinbock']
    ports:
      - '5678:5678'
  pytest:
    image: ghcr.io/bodenmillergroup/steinbock:latest
    volumes:
      - .:/app/steinbock
    entrypoint: /bin/bash
    command: ['-c', 'pip install -U ddtrace && python -m pytest tests --cov=steinbock --cov-report xml:coverage.xml --ddtrace']
    working_dir: /app/steinbock
    user: root
    environment:
      - DD_CIVISIBILITY_ENABLED
      - DD_CIVISIBILITY_AGENTLESS_ENABLED
      - DD_SITE
      - DD_API_KEY
      - GITHUB_ACTION
      - GITHUB_SERVER_URL
      - GITHUB_RUN_ID
      - GITHUB_RUN_NUMBER
      - GITHUB_RUN_ATTEMPT
      - GITHUB_WORKFLOW
      - GITHUB_WORKSPACE
      - GITHUB_REPOSITORY
      - GITHUB_SHA
      - GITHUB_HEAD_REF
      - GITHUB_REF
      - GITHUB_JOB
  pytest-debug:
    image: ghcr.io/bodenmillergroup/steinbock:latest
    volumes:
      - .:/app/steinbock
    entrypoint: /bin/bash
    command: ['-c', 'python -m pip install debugpy -t /tmp && python /tmp/debugpy --wait-for-client --listen 0.0.0.0:5678 -m pytest tests --cov=steinbock --cov-report xml:coverage.xml']
    ports:
      - '5678:5678'
    working_dir: /app/steinbock
    user: root
